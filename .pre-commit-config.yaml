exclude: ^docker/vendor/
repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-yaml
  - id: check-toml
  - id: debug-statements
  - id: end-of-file-fixer
    exclude: docker/build_scripts/python_versions.json
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
  hooks:
  - id: shellcheck

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
  hooks:
  - id: ruff-check
    args: ["--fix", "--show-fixes", "--target-version=py38"]
    exclude: ^tools/.*.py|docker/build_scripts/manylinux-interpreters.py$
  - id: ruff-format
    args: ["--target-version=py38"]
    exclude: ^tools/.*.py|docker/build_scripts/manylinux-interpreters.py$
  - id: ruff-check
    name: ruff on python 3.12 tools
    files: ^tools/.*.py|docker/build_scripts/manylinux-interpreters.py$
    args: ["--fix", "--show-fixes", "--target-version=py312"]
  - id: ruff-format
    name: ruff-format on python 3.12 tools
    files: ^tools/.*.py|docker/build_scripts/manylinux-interpreters.py$
    args: ["--target-version=py312"]

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["-w"]
    exclude: ^docker/build_scripts/.*pubkey.*.txt$

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
  hooks:
  - id: zizmor
